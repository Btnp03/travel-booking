version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: travel_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_pass
      POSTGRES_DB: travel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: